# NET Thermal Simulator - TrueNAS SCALE Custom App
#
# Avant l'installation :
# 1. Remplacer les valeurs TODO ci-dessous.
# 2. Adapter /mnt/tank au nom réel de votre pool TrueNAS si vous ajoutez
#    ensuite des volumes persistants.
#
# L'image est publiée par GitHub Container Registry par la release v0.2.0.

services:
  net-thermal-simulator:
    image: ghcr.io/freakstreet/freakydomos-thermal-simulator:v0.2.0
    pull_policy: always
    restart: unless-stopped
    ports:
      - target: 8090
        published: 8090
        protocol: tcp
        mode: ingress
    environment:
      NET_MASTER_HOST: "TODO_IP_OU_NOM_DNS_DU_MASTER"
      NET_MASTER_PORT: "8082"
      NET_MASTER_TOKEN: "TODO_TOKEN_NET"
      NET_DEVICE_ID: "SIM"
      INFLUXDB_URL: "http://TODO_IP_INFLUXDB:8086"
      INFLUXDB_TOKEN: "TODO_TOKEN_INFLUXDB"
      INFLUXDB_ORG: "TODO_ORGANISATION"
      INFLUXDB_BUCKET: "FreakyDomos"
      WEATHER_CSV: "/app/data/weather_2024_luz_saint_sauveur.csv"
      SIMULATION_INITIAL_TEMPERATURE: "20"
      SIMULATION_STEP_SECONDS: "10"
      WEB_PORT: "8090"
